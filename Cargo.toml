[package]
name = "vectordb"
version = "0.1.0"
edition = "2021"
description = "Persistent approximate nearest-neighbour search engine: HNSW, product quantization, SIMD distances, WAL + snapshots"
rust-version = "1.89"

[dependencies]
parking_lot = "0.12"
rand = { version = "0.8", features = ["small_rng"] }
crc32fast = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = "0.7"
tonic = "0.12"
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"

[dev-dependencies]
proptest = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures-core = "0.3"
libc = "0.2"

[[bin]]
name = "vectordb"
path = "src/main.rs"

[[bin]]
name = "vdb-bench"
path = "src/bin/bench.rs"

[profile.release]
debug = 1
codegen-units = 4

[profile.test]
opt-level = 2
